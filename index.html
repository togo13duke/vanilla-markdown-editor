<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>バニラMarkdownエディタ</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-header">
        <div class="app-title">バニラMarkdownエディタ</div>
      </header>
      <div class="app-main">
        <div class="mobile-tabs" role="tablist" aria-label="表示切替">
          <button
            type="button"
            class="tab-button"
            data-pane="editor"
            aria-selected="true"
          >
            エディタ
          </button>
          <button
            type="button"
            class="tab-button"
            data-pane="preview"
            aria-selected="false"
          >
            プレビュー
          </button>
        </div>
        <div class="pane-grid">
          <aside
            class="sidebar pane"
            data-pane="files"
            aria-label="ファイル一覧"
          >
            <div class="pane-header">
              <span>ファイル</span>
              <div class="file-actions">
                <button
                  type="button"
                  class="icon-button new-file-button"
                  aria-label="新規ファイル"
                >
                  ＋
                </button>
                <button
                  type="button"
                  class="icon-button file-export-button"
                  aria-label="ファイルをエクスポート"
                >
                  ↓
                </button>
              </div>
            </div>
            <ul class="file-list"></ul>
          </aside>
          <section class="editor pane" data-pane="editor" aria-label="エディタ">
            <div class="pane-header">エディタ</div>
            <textarea
              class="editor-input"
              placeholder="Markdownを入力してください..."
            ></textarea>
          </section>
          <section
            class="preview pane"
            data-pane="preview"
            aria-label="プレビュー"
          >
            <div class="pane-header">プレビュー</div>
            <div class="preview-content">
              <p>ここにプレビューが表示されます。</p>
              <p>見出し、強調、リンクなどが反映される想定です。</p>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
